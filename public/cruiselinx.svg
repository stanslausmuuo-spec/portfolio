<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)" rx="12"/>
  
  <!-- Sidebar / Nav -->
  <rect x="30" y="30" width="160" height="440" rx="8" fill="#1e293b" opacity="0.8"/>
  <circle cx="60" cy="65" r="14" fill="#3b82f6"/>
  <rect x="85" y="57" fx="0" fy="0" width="80" height="16" rx="4" fill="#334155"/>
  <rect x="45" y="110" width="130" height="32" rx="6" fill="#2563eb" opacity="0.3"/>
  <rect x="45" y="155" width="110" height="20" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="45" y="190" width="120" height="20" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="45" y="225" width="90" height="20" rx="4" fill="#334155" opacity="0.6"/>

  <!-- Main Content Header -->
  <rect x="210" y="30" width="560" height="60" rx="8" fill="#1e293b" opacity="0.8"/>
  <rect x="235" y="50" width="220" height="20" rx="4" fill="#f8fafc" opacity="0.9"/>
  <circle cx="730" cy="60" r="16" fill="#06b6d4" opacity="0.8"/>

  <!-- Map / Grid background -->
  <rect x="210" y="110" width="560" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Map roads simulation -->
  <path d="M210 200 H770 M210 350 H770 M350 110 V470 M580 110 V470" stroke="#1e293b" stroke-width="4"/>
  <path d="M210 280 C 300 250, 450 320, 770 230" stroke="#2563eb" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Car Card Overlay -->
  <rect x="240" y="320" width="240" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="255" y="335" width="80" height="50" rx="4" fill="#3b82f6" opacity="0.3"/>
  <rect x="345" y="335" width="115" height="16" rx="4" fill="#f8fafc" opacity="0.9"/>
  <rect x="345" y="360" width="80" height="12" rx="3" fill="#06b6d4" opacity="0.8"/>
  <rect x="345" y="395" width="110" height="24" rx="4" fill="url(#accent1)"/>

  <!-- Pin 1 -->
  <circle cx="450" cy="220" r="12" fill="#2563eb"/>
  <circle cx="450" cy="220" r="5" fill="#fff"/>

  <!-- Pin 2 -->
  <circle cx="620" cy="300" r="12" fill="#06b6d4"/>
  <circle cx="620" cy="300" r="5" fill="#fff"/>
  
  <!-- Title watermark / Badge -->
  <rect x="620" y="130" width="130" height="30" rx="15" fill="#2563eb" opacity="0.2"/>
  <text x="685" y="150" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CruiseLinx P2P</text>
</svg>