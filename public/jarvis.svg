<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#181824"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2)" rx="12"/>
  
  <!-- Header bar -->
  <rect x="30" y="30" width="740" height="50" rx="8" fill="#181824" stroke="#27273a" stroke-width="1"/>
  <circle cx="55" cy="55" r="8" fill="#9333ea"/>
  <rect x="75" y="47" width="140" height="16" rx="4" fill="#f8fafc" opacity="0.9"/>
  <rect x="620" y="43" width="130" height="24" rx="12" fill="#9333ea" opacity="0.3"/>

  <!-- Center AI Orb / Visualizer -->
  <circle cx="400" cy="240" r="70" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.4"/>
  <circle cx="400" cy="240" r="95" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="400" cy="240" r="50" fill="url(#glow)"/>
  
  <!-- Audio Waveform Bars -->
  <g transform="translate(250, 360)">
    <rect x="0" y="15" width="8" height="30" rx="4" fill="#a855f7"/>
    <rect x="15" y="5" width="8" height="50" rx="4" fill="#c084fc"/>
    <rect x="30" y="20" width="8" height="20" rx="4" fill="#9333ea"/>
    <rect x="45" y="0" width="8" height="60" rx="4" fill="#818cf8"/>
    <rect x="60" y="10" width="8" height="40" rx="4" fill="#6366f1"/>
    <rect x="75" y="25" width="8" height="15" rx="4" fill="#a855f7"/>
    <rect x="90" y="8" width="8" height="45" rx="4" fill="#c084fc"/>
    <rect x="105" y="18" width="8" height="25" rx="4" fill="#818cf8"/>
    <rect x="120" y="5" width="8" height="50" rx="4" fill="#9333ea"/>
    <rect x="135" y="12" width="8" height="35" rx="4" fill="#6366f1"/>
    <rect x="150" y="22" width="8" height="18" rx="4" fill="#c084fc"/>
    <rect x="165" y="2" width="8" height="55" rx="4" fill="#a855f7"/>
    <rect x="180" y="15" width="8" height="30" rx="4" fill="#818cf8"/>
    <rect x="195" y="8" width="8" height="45" rx="4" fill="#9333ea"/>
    <rect x="210" y="20" width="8" height="20" rx="4" fill="#6366f1"/>
    <rect x="225" y="10" width="8" height="40" rx="4" fill="#c084fc"/>
    <rect x="240" y="25" width="8" height="15" rx="4" fill="#a855f7"/>
    <rect x="255" y="5" width="8" height="50" rx="4" fill="#818cf8"/>
    <rect x="270" y="18" width="8" height="25" rx="4" fill="#9333ea"/>
    <rect x="285" y="12" width="8" height="35" rx="4" fill="#6366f1"/>
  </g>

  <!-- Status pill -->
  <rect x="310" y="440" width="180" height="28" rx="14" fill="#181824" stroke="#27273a" stroke-width="1"/>
  <circle cx="330" cy="454" r="5" fill="#22c55e"/>
  <text x="400" y="458" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Ollama + LiveKit Active</text>
</svg>